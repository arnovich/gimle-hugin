name: finalize_agent
description: Fix issues from review and write agent files
chain_config: agent_builder
pass_result_as: finalize_result
parameters:
  review_feedback:
    type: string
    description: Feedback from the review step
    required: true
  agent_name:
    type: string
    description: Name of the agent being built
    required: true
  description:
    type: string
    description: Original description of what the agent should do
    required: true
  output_path:
    type: string
    description: Where to write the agent files
    required: true
tools:
  # The config's entire toolset, minus `finish`. Task tools replace the
  # config's, so this list must stay a superset of everything earlier
  # stages call: they share one stack, and a tool missing here orphans
  # its tool_use block from the build stage, which makes the whole
  # conversation invalid (400: tool_use without tool_result).
  #
  # Omitting `finish` is the entire point -- write_and_finish is then
  # the only way to end this stage, so finishing without writing is not
  # something the model can express.
  - list_examples
  - read_example
  - generate_config
  - generate_task
  - generate_template
  - generate_tool
  - preview_files
  - read_generated_file
  - validate_agent
  - write_agent_files
  - write_and_finish
  - test_agent
  - builtins.save_file:save_file
prompt: |
  The agent files for **{{ agent_name.value }}** have been reviewed.

  ## ORIGINAL DESCRIPTION (what the user asked for)

  {{ description.value }}

  ## REVIEW FEEDBACK

  {{ review_feedback.value }}

  ## Your Task

  ### If Status is APPROVED:
  1. Call `write_and_finish` with a short summary. It writes the agent and ends
     this stage in one step.

  ### If Status is NEEDS_FIXES:
  1. Fix each issue using the appropriate tool:
     - Config issues -> `generate_config` (name MUST be `{{ agent_name.value }}`)
     - Task issues -> `generate_task`
     - Template issues -> `generate_template`
     - Tool issues -> `generate_tool` with ACTUAL PYTHON CODE

     Use `read_generated_file` to see what is currently there before you
     regenerate a file, so you edit it rather than reinventing it.

  2. Focus especially on matching the original description above.

  3. Call `validate_agent` to check your fixes.

  4. Call `write_and_finish`. If the payload does not validate the write is
     refused and you get the errors back -- fix them and call it again.

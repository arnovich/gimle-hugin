name: agent_builder
description: An agent that creates new Hugin agents based on user requirements
system_template: builder_system
llm_model: sonnet-latest
tools:
  # Study first: these give the builder the repo's real, executable examples
  # rather than making it invent structure from the prompt alone.
  - list_examples
  - read_example
  # Edit mode: read an existing agent in, so every generator above
  # becomes an edit tool for the file it regenerates.
  - load_agent_files
  - generate_config
  - generate_task
  - generate_template
  - generate_tool
  - preview_files
  - read_generated_file
  - validate_agent
  - write_agent_files
  - write_and_finish
  - test_agent
  - builtins.save_file:save_file
  - builtins.finish:finish
interactive: false
options: {}

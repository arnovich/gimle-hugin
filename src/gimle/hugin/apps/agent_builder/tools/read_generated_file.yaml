name: read_generated_file
description: >-
  Read back one file you have already generated, by its path (e.g.
  tools/fetch_prices.py). Use this before regenerating a file so you edit what
  is actually there rather than re-inventing it from an error message.
parameters:
  path:
    type: string
    description: Key of the generated file, e.g. 'tools/fetch_prices.py'
    required: true
is_interactive: false
implementation_path: agent_builder.tools.read_generated_file:read_generated_file
options:
  # Wide enough to hold a whole small agent at once. At 3, a task reasoning
  # about five files evicted the oldest read on every new one -- so the model
  # would notice a file it needed was no longer visible, read it again, and
  # evict another. That is a rational loop, not a flaky model, and it burned
  # entire runs: one improve run spent 18 reads over 5 files and never got
  # as far as proposing anything.
  include_only_in_context_window: true
  context_window: 10

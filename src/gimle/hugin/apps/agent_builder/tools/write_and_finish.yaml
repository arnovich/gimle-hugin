name: write_and_finish
description: >-
  Write the generated agent to disk and finish this stage. This is the only way
  to end the finalize stage -- there is no separate finish tool here, because
  finishing without writing throws the agent away. If the payload does not
  validate the write is refused and the stage ends as a failure with the
  errors, which you should fix and then call this again.
parameters:
  result:
    type: string
    description: Short summary of the agent that was built
    required: true
  output_path:
    type: string
    description: >-
      Where to write. Omit to use the path the build was started with.
    required: false
is_interactive: false
implementation_path: agent_builder.tools.write_and_finish:write_and_finish
options:
  include_reason: true
  respond_with_text: true
